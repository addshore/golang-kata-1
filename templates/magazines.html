<!DOCTYPE html>
<html>
<head>
    <title>Magazines</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Magazines</h1>
    <form method="get" action="/magazines">
        <label for="isbn">Search by ISBN:</label>
        <input type="text" id="isbn" name="isbn" placeholder="Enter ISBN">
        <label for="author">or Author Email:</label>
        <input type="text" id="author" name="author" placeholder="Enter Author Email">
        <button type="submit">Search</button>
        <a href="/magazines">Show All</a>
    </form>
    <table border="1">
        <tr>
            <th>Title</th>
            <th>ISBN</th>
            <th>Authors</th>
            <th>Published At</th>
        </tr>
        {{range .}}
        <tr>
            <td>{{.Title}}</td>
            <td>{{.ISBN}}</td>
            <td>{{.Authors}}</td>
            <td>{{.PublishedAt}}</td>
        </tr>
        {{end}}
    </table>
</body>
</html>
