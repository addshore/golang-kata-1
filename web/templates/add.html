<!DOCTYPE html>
<html>
<head>
    <title>Add to Library</title>
    <script>
        function toggleFields() {
            const type = document.getElementById('type').value;
            document.getElementById('bookFields').style.display = type === 'book' ? 'block' : 'none';
            document.getElementById('magazineFields').style.display = type === 'magazine' ? 'block' : 'none';
            document.getElementById('authorFields').style.display = type === 'book' || type === 'magazine' ? 'block' : 'none';
        }
    </script>
</head>
<body>
    <h1>Add to Library</h1>
    <form method="POST">
        <label>Type (book/magazine): <input type="text" id="type" name="type" oninput="toggleFields()"></label><br>
        <label>Title: <input type="text" name="title"></label><br>
        <label>Author Email: <input type="text" name="authorEmail"></label><br>
        <label>ISBN: <input type="text" name="isbn"></label><br>
        <div id="authorFields" style="display:none;">
            <label>Author First Name: <input type="text" name="firstName"></label><br>
            <label>Author Last Name: <input type="text" name="lastName"></label><br>
        </div>
        <div id="bookFields" style="display:none;">
            <label>Genre: <input type="text" name="genre"></label><br>
        </div>
        <div id="magazineFields" style="display:none;">
            <label>Published Date: <input type="text" name="publishedDate"></label><br>
        </div>
        <button type="submit">Add</button>
    </form>
</body>
</html>
