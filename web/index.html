<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library Web UI</title>
</head>
<body>
  <h1>Library Web UI</h1>
  <div>
    <button onclick="loadAll()">Show All Books & Magazines</button>
    <button onclick="showAddForm()">Add Book/Magazine/Author</button>
    <input id="searchInput" placeholder="Search ISBN or Author Email">
    <button onclick="search()">Search</button>
    <button onclick="sortByTitle()">Sort by Title</button>
  </div>
  <div id="formDiv" style="display:none;"></div>
  <div id="results"></div>
  <script src="app.js"></script>
</body>
</html>
